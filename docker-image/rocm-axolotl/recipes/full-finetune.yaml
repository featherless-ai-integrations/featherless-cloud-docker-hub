# Single-GPU full-parameter BF16 supervised fine-tuning.
# Axolotl v0.18.0; candidate MI325X/gfx942 recipe, not a GPU-support claim.
# Run axolotl-workspace, then cd /workspace/axolotl (or your chosen destination).
# axolotl preprocess full-finetune.yaml
# axolotl train full-finetune.yaml --launcher python
# Public immutable assets download only on these explicit commands.
# Paths are relative to your working directory, not this YAML's directory.
# Use a new output_dir for a fresh experiment; preserve checkpoints when resuming.
# No adapter or quantization: optimizer state is allocated for the whole model.
base_model: Qwen/Qwen2.5-0.5B-Instruct
revision_of_model: 7ae557604adf67be50417f59c2c2f167def9a775
trust_remote_code: false
datasets:
  - path: mhenrichsen/alpaca_2k_test
    revision: d05c1cb585e462b16532a44314aa4859cb7450c6
    type: alpaca
    split: train
load_in_4bit: false
load_in_8bit: false
# Qwen2 dense text layers support these Liger Triton kernels.
plugins:
  - axolotl.integrations.liger.LigerPlugin
liger_rope: true
liger_rms_norm: true
liger_glu_activation: true
# Exactly one CE patch: do not also enable flash-attn/torch/Unsloth CE patches.
liger_cross_entropy: false
liger_fused_linear_cross_entropy: true
dataset_prepared_path: ./prepared/full-finetune
output_dir: ./outputs/full-finetune
val_set_size: 0.0
sequence_len: 2048
sample_packing: true
pad_to_sequence_len: true
# Packing relies on the image's ROCm FlashAttention-2 build; do not silently use SDPA.
attn_implementation: flash_attention_2
micro_batch_size: 1
gradient_accumulation_steps: 4
num_epochs: 1
# Small functional starting run, not a throughput or convergence benchmark.
max_steps: 20
learning_rate: 0.00002
optimizer: adamw_torch
lr_scheduler: cosine
warmup_steps: 2
weight_decay: 0.01
max_grad_norm: 1.0
bf16: true
fp16: false
tf32: false
train_on_inputs: false
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
logging_steps: 1
save_steps: 20
save_total_limit: 2
save_safetensors: true
seed: 42
