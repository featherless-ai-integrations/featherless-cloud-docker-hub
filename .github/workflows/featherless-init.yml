name: featherless-init

on:
  pull_request:
    paths:
      - featherless-init/**
      - scripts/featherless-login-banner
      - scripts/featherless-init
      - templates/featherless-init.Dockerfile
      - templates/rocm.Dockerfile
      - docker-image/featherless-init/**
      - Dockerfile
      - .github/workflows/featherless-init.yml
  push:
    branches: [main]
    paths:
      - featherless-init/**
      - scripts/featherless-login-banner
      - scripts/featherless-init
      - templates/featherless-init.Dockerfile
      - templates/rocm.Dockerfile
      - docker-image/featherless-init/**
      - Dockerfile
      - .github/workflows/featherless-init.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Lint the scripts
        run: shellcheck -s sh featherless-init/featherless-init featherless-init/services featherless-init/profile.d/featherless.sh

  lab:
    name: lab (${{ matrix.image }})
    runs-on: ubuntu-24.04
    strategy:
      # Each distro gets its own runner: the package-manager install, SSH, tmux and signal
      # checks for one image must not hide a failure in another. The images cover every
      # installer the init probes (apt, dnf, dnf5, microdnf, apk, zypper); yum remains only
      # on the EOL RHEL 7.
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - debian:trixie-slim
          - rockylinux/rockylinux:9
          - fedora:42
          - registry.access.redhat.com/ubi9-minimal:latest
          - opensuse/leap:15.6
          - alpine:3.22
          # A template image (scripts/featherless-init) behind the init, built on Ubuntu.
          - template
    steps:
      - uses: actions/checkout@v7

      # Runs the image from Docker image mounts, as instances mount it, and checks the instance
      # command, SSH, tmux, sshd restarts, zombie reaping and SIGTERM in the base image.
      - name: Run the instance lab
        run: featherless-init/test/lab.sh '${{ matrix.image }}'
