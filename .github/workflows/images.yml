name: Build and publish images

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated Dockerfiles
        run: scripts/render-dockerfiles --check
      - name: Read pinned release matrix
        id: matrix
        run: echo "value=$(scripts/release-matrix)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    # Matrix jobs are isolated: each image gets its own GitHub-hosted runner.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      OUTPUT_NAMESPACE: featherlesscloud
      SHOULD_PUSH: ${{ github.event_name != 'pull_request' }}
      CREATE_NEW_USER: ${{ vars.CREATE_NEW_USER || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Require Docker Hub configuration for publishing
        if: env.SHOULD_PUSH == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo 'Missing secret DOCKERHUB_USERNAME' >&2; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo 'Missing secret DOCKERHUB_TOKEN' >&2; exit 1; }

      - uses: docker/login-action@v3
        if: env.SHOULD_PUSH == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull pinned AMD source image
        run: docker pull --platform linux/amd64 '${{ matrix.source }}'

      - name: Pull existing built image when available
        id: existing
        env:
          BUILT_IMAGE: ${{ env.OUTPUT_NAMESPACE }}/${{ matrix.repository }}:${{ matrix.version }}
        run: |
          if docker pull --platform linux/amd64 "$BUILT_IMAGE"; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No existing built image; this version will build from source.'
            echo 'found=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build ${{ matrix.repository }}
        env:
          BUILT_IMAGE: ${{ env.OUTPUT_NAMESPACE }}/${{ matrix.repository }}:${{ matrix.version }}
          SHA_IMAGE: ${{ env.OUTPUT_NAMESPACE }}/${{ matrix.repository }}:sha-${{ github.sha }}
          CACHE_FOUND: ${{ steps.existing.outputs.found }}
        run: |
          cache_args=()
          if [[ "$CACHE_FOUND" == true ]]; then
            cache_args+=(--cache-from "$BUILT_IMAGE")
          fi
          docker build \
            --platform linux/amd64 \
            --pull \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --build-arg "CREATE_NEW_USER=$CREATE_NEW_USER" \
            "${cache_args[@]}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label 'org.opencontainers.image.version=${{ matrix.version }}' \
            --file '${{ matrix.repository }}/Dockerfile' \
            --tag "$BUILT_IMAGE" \
            --tag "$SHA_IMAGE" \
            .

      - name: Publish ${{ matrix.repository }}
        if: env.SHOULD_PUSH == 'true'
        env:
          BUILT_IMAGE: ${{ env.OUTPUT_NAMESPACE }}/${{ matrix.repository }}:${{ matrix.version }}
          SHA_IMAGE: ${{ env.OUTPUT_NAMESPACE }}/${{ matrix.repository }}:sha-${{ github.sha }}
        run: |
          docker push "$BUILT_IMAGE"
          docker push "$SHA_IMAGE"
