name: Build images

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    # ROCm bases are 10-25+ GB compressed; use a high-disk x86_64 runner.
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Verify generated Dockerfiles
        run: scripts/render-dockerfiles --check
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and publish outside pull requests)
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'edge' }}
        run: docker buildx bake ${{ github.event_name != 'pull_request' && '--push' || '' }}
